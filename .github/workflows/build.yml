name: Build GraVal

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge,defaults
          channel-priority: strict
          activate-environment: graval

      - name: Install system dependencies
        run: brew install proj geos gdal

      - name: Install dependencies
        run: |
          conda install -c conda-forge pyhdf -y
          python -m pip install pyinstaller
          grep -iv "pyhdf" requirements.txt | python -m pip install -r /dev/stdin

      - name: Build with PyInstaller
        run: pyinstaller CGvalidator.spec

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraVal-macOS
          path: dist/GraVal.app
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller CGvalidator.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GraVal-Windows
          path: dist/GraVal/
          retention-days: 30
